<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title">
  <title id="title">Euphoria logo</title>
  <defs>
    <linearGradient id="euphoriaGradient" x1="120" y1="34" x2="120" y2="286" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff43c7" />
      <stop offset="0.52" stop-color="#c02ed6" />
      <stop offset="1" stop-color="#44206f" />
    </linearGradient>
    <linearGradient id="textGradient" x1="310" y1="80" x2="1110" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f02ec1" />
      <stop offset="0.52" stop-color="#c22bcd" />
      <stop offset="1" stop-color="#4c2379" />
    </linearGradient>
    <pattern id="dotPattern" width="23" height="23" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="6.2" fill="url(#euphoriaGradient)" />
    </pattern>
    <clipPath id="diamondClip">
      <polygon points="140 28 252 140 140 252 28 140" />
    </clipPath>
    <filter id="soften" x="-8%" y="-8%" width="116%" height="116%">
      <feGaussianBlur stdDeviation="0.18" />
    </filter>
  </defs>
  <rect width="1200" height="360" fill="none" />
  <g clip-path="url(#diamondClip)" filter="url(#soften)">
    <rect x="20" y="20" width="245" height="245" fill="url(#dotPattern)" />
  </g>
  <text
    x="320"
    y="192"
    fill="url(#textGradient)"
    font-family="Inter, Montserrat, Arial, sans-serif"
    font-size="116"
    font-weight="800"
    letter-spacing="-3"
  >EUPHORIA</text>
</svg>
